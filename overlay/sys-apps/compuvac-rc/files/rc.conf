# Compuvac /etc/rc.conf: read by the rc scripts at boot.
HOSTNAME="compuvac"
KEYMAP="uk"
# the console font before the login screen (from /usr/share/consolefonts), blank for the default
FONT=""
# services started at boot, in this order (scripts in /etc/rc.d); stopped in reverse
SERVICES=(syslog seatd alsa network)
